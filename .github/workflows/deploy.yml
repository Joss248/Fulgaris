name: CI BEPARTNERS

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar Laravel y compilar frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo_sqlite, zip
          tools: composer:v2
          coverage: none

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar y validar dependencias PHP
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan route:list --except-vendor

      - name: Verificar migraciones y seeders en SQLite
        run: |
          DB_DATABASE="$(mktemp "$RUNNER_TEMP/bepartners-XXXXXX.sqlite")"
          export DB_DATABASE
          trap 'rm -f -- "$DB_DATABASE"' EXIT
          php artisan migrate --seed --no-interaction
          php artisan migrate:status --no-interaction

      # Las pruebas de las vistas Blade necesitan el manifiesto de Vite.
      - name: Instalar y compilar frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json

      - name: Ejecutar pruebas
        run: php artisan test --log-junit junit.xml

      - name: Publicar compilación
        uses: actions/upload-artifact@v7
        with:
          name: bepartners-frontend
          path: public/build/
          if-no-files-found: error

      - name: Publicar reporte de pruebas
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bepartners-pruebas
          path: junit.xml
          if-no-files-found: error

  deploy-test:
    name: Solicitar despliegue en Render (pruebas)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: pruebas
    permissions:
      contents: read
    concurrency:
      group: render-pruebas
      cancel-in-progress: false

    steps:
      - name: Comprobar que el commit sigue vigente en develop
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! head_sha="$(curl --disable --silent --fail --proto '=https' \
            --connect-timeout 5 --max-time 15 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/develop" \
            | jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"; then
            echo '::error::No se pudo verificar la punta de develop en GitHub.'
            exit 1
          fi

          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'Solicitud omitida. Develop ya apunta a otro commit.'
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Enviar solicitud privada a Render
        if: steps.branch.outputs.current == 'true'
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_TEST: ${{ secrets.RENDER_DEPLOY_HOOK_TEST }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_TEST" ]]; then
            echo '::error::Falta el secreto RENDER_DEPLOY_HOOK_TEST.'
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_TEST" != https://api.render.com/deploy/* ]]; then
            echo '::error::RENDER_DEPLOY_HOOK_TEST debe contener un Deploy Hook HTTPS de Render.'
            exit 1
          fi

          if http_code="$(curl --disable --silent --request POST --proto '=https' \
            --connect-timeout 5 --max-time 30 \
            --url-query "ref=$GITHUB_SHA" --url "$RENDER_DEPLOY_HOOK_TEST" \
            --output /dev/null --write-out '%{http_code}')"; then
            case "$http_code" in
              200) echo 'Render inició el despliegue solicitado. El resultado final está pendiente.' ;;
              202) echo 'Render puso la solicitud en espera. El resultado final está pendiente.' ;;
              *)
                echo "::error::Render no confirmó la solicitud (HTTP $http_code)."
                exit 1
                ;;
            esac
          else
            echo '::error::No se pudo confirmar la solicitud por un fallo de conexión o tiempo de espera. Revisa Render antes de reintentar.'
            exit 1
          fi

  deploy-preprod:
    name: Solicitar despliegue en Render (preproducción)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: preproduccion
    permissions:
      contents: read
    concurrency:
      group: render-preproduccion
      cancel-in-progress: false

    steps:
      - name: Comprobar que el commit sigue vigente en main
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! head_sha="$(curl --disable --silent --fail --proto '=https' \
            --connect-timeout 5 --max-time 15 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))')"; then
            echo '::error::No se pudo verificar la punta de main en GitHub.'
            exit 1
          fi

          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'Solicitud omitida. Main ya apunta a otro commit.'
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Enviar solicitud privada a Render
        if: steps.branch.outputs.current == 'true'
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_PREPROD: ${{ secrets.RENDER_DEPLOY_HOOK_PREPROD }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_PREPROD" ]]; then
            echo '::error::Falta el secreto RENDER_DEPLOY_HOOK_PREPROD.'
            exit 1
          fi
          if [[ "$RENDER_DEPLOY_HOOK_PREPROD" != https://api.render.com/deploy/* ]]; then
            echo '::error::RENDER_DEPLOY_HOOK_PREPROD debe contener un Deploy Hook HTTPS de Render.'
            exit 1
          fi

          if http_code="$(curl --disable --silent --request POST --proto '=https' \
            --connect-timeout 5 --max-time 30 \
            --url-query "ref=$GITHUB_SHA" --url "$RENDER_DEPLOY_HOOK_PREPROD" \
            --output /dev/null --write-out '%{http_code}')"; then
            case "$http_code" in
              200) echo 'Render inició el despliegue solicitado. El resultado final está pendiente.' ;;
              202) echo 'Render puso la solicitud en espera. El resultado final está pendiente.' ;;
              *)
                echo "::error::Render no confirmó la solicitud (HTTP $http_code)."
                exit 1
                ;;
            esac
          else
            echo '::error::No se pudo confirmar la solicitud por un fallo de conexión o tiempo de espera. Revisa Render antes de reintentar.'
            exit 1
          fi
